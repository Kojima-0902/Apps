<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ジムトラッカー">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <title>ジムトラッカー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <h1>トレーニング</h1>
    <button class="header-btn" onclick="Workouts.showAdd()">＋</button>
  </header>

  <!-- Main content -->
  <main class="main" id="main"></main>

  <!-- Tab bar -->
  <nav class="tab-bar">
    <button class="tab-item active" data-page="workouts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5h-3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/>
        <path d="M6.5 12.5h-3a1 1 0 0 0-1 1v3a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1z"/>
        <path d="M12 7h8M12 12h8M12 17h8"/>
      </svg>
      <span>トレーニング</span>
    </button>
    <button class="tab-item" data-page="bodyweight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v17M8 7l4-4 4 4"/>
        <rect x="3" y="14" width="18" height="6" rx="2"/>
      </svg>
      <span>体重</span>
    </button>
    <button class="tab-item" data-page="charts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/>
        <path d="M7 16l4-6 4 3 5-7"/>
      </svg>
      <span>グラフ</span>
    </button>
  </nav>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- App scripts -->
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/workouts.js"></script>
  <script src="js/bodyweight.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
