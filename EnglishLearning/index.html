<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a18">
  <title>Speak! 英会話</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="header">
    <div class="header-title">Speak!</div>
    <div class="header-subtitle">声に出して、話せるようになる</div>
  </header>

  <div id="install-banner" class="install-banner hidden">
    <p>ホーム画面に追加していつでも練習</p>
    <button id="install-btn" class="install-btn">追加</button>
    <button id="install-dismiss-btn" class="install-dismiss">✕</button>
  </div>

  <!-- ===== TALK TAB (HERO) ===== -->
  <section id="tab-talk" class="tab-content active">
    <div class="scroll-area">

      <!-- One-tap hero -->
      <div class="hero-card">
        <div class="hero-greeting" id="hero-greeting">さあ、話そう</div>
        <div class="hero-sub" id="hero-sub">今日のひとこと会話 · 約3分</div>
        <button class="hero-start-btn" id="hero-start-btn">
          <span class="hero-start-icon">🎙️</span>
          <span id="hero-start-label">会話をはじめる</span>
        </button>
        <div class="hero-mini-stat" id="hero-mini-stat"></div>
      </div>

      <!-- Scenario picker (autonomy) -->
      <div class="section-heading">シーンを選ぶ</div>
      <div id="roleplay-list" class="roleplay-list"></div>

    </div>
  </section>

  <!-- ===== PHRASES (CHUNKS) TAB ===== -->
  <section id="tab-phrases" class="tab-content">
    <div class="scroll-area">
      <div class="section-heading">使えるフレーズの「かたまり」</div>
      <p class="tab-intro">会話で丸ごと使える表現を、声に出して覚えましょう。</p>

      <div class="mode-tabs" id="phrase-type-tabs">
        <button class="mode-btn active" data-type="general">日常</button>
        <button class="mode-btn" data-type="business">ビジネス</button>
      </div>
      <div class="cat-scroll">
        <div id="category-tabs" class="category-tabs"></div>
      </div>
      <div id="phrase-list"></div>
    </div>
  </section>

  <!-- ===== PROGRESS TAB ===== -->
  <section id="tab-progress" class="tab-content">
    <div class="scroll-area">

      <!-- Hero metric: scenes -->
      <div class="scenes-banner">
        <div class="scenes-num" id="scenes-num">0</div>
        <div class="scenes-label">回の会話を達成</div>
      </div>

      <!-- Can-do list -->
      <div class="section-heading">できるようになったこと</div>
      <p class="tab-intro">英語で「実際にできること」が増えていきます。</p>
      <div id="cando-list" class="cando-list"></div>

      <!-- Gentle streak (subordinated) -->
      <div class="gentle-streak" id="gentle-streak">
        <span class="gs-fire">🔥</span>
        <span id="gs-text">今日が初日！</span>
      </div>

      <button id="prog-reset-btn" class="btn-reset">学習データをリセット</button>
    </div>
  </section>

  <!-- ===== ROLEPLAY PLAYER OVERLAY ===== -->
  <div id="rp-overlay" class="overlay hidden">
    <div class="rp-screen">
      <div class="rp-topbar">
        <button id="rp-close-btn" class="rp-close">✕</button>
        <div class="rp-title" id="rp-title"></div>
        <div class="rp-progress-text" id="rp-progress-text"></div>
      </div>
      <div class="rp-progress-bar"><div id="rp-progress-fill" class="rp-progress-fill"></div></div>

      <!-- Scene intro -->
      <div id="rp-intro" class="rp-intro">
        <div class="rp-intro-icon" id="rp-intro-icon">☕</div>
        <div class="rp-intro-title" id="rp-intro-title"></div>
        <div class="rp-intro-scene" id="rp-intro-scene"></div>
        <button id="rp-intro-start" class="btn-primary" style="width:100%;margin-top:20px">スタート 🎙️</button>
        <p class="rp-intro-note">🔊 音が出ます。マイクの使用を許可してください。</p>
      </div>

      <!-- Conversation flow -->
      <div id="rp-flow" class="rp-flow hidden">
        <div id="rp-chat" class="rp-chat"></div>

        <!-- Your turn panel -->
        <div id="rp-your-turn" class="rp-your-turn hidden">
          <div class="rp-prompt-label">あなたの番 · 日本語で言いたいこと</div>
          <div class="rp-prompt-ja" id="rp-prompt-ja"></div>
          <div class="rp-hint hidden" id="rp-hint"></div>
          <div id="rp-recog-result" class="rp-recog-result hidden"></div>
          <button id="rp-mic-btn" class="rp-mic-btn">
            <span class="rp-mic-icon">🎙️</span>
            <span id="rp-mic-label">タップして話す</span>
          </button>
          <div class="rp-your-actions">
            <button id="rp-hint-btn" class="btn-ghost">💡 ヒント</button>
            <button id="rp-listen-btn" class="btn-ghost">🔊 お手本</button>
            <button id="rp-skip-btn" class="btn-ghost">スキップ →</button>
          </div>
        </div>

        <!-- NPC turn indicator -->
        <div id="rp-npc-turn" class="rp-npc-turn hidden">
          <button id="rp-npc-replay" class="btn-ghost">🔊 もう一度聞く</button>
          <button id="rp-npc-next" class="btn-primary">続ける →</button>
        </div>
      </div>

      <!-- Completion celebration -->
      <div id="rp-complete" class="rp-complete hidden">
        <div class="confetti" id="confetti"></div>
        <div class="rp-complete-icon">🎉</div>
        <div class="rp-complete-msg" id="rp-complete-msg"></div>
        <div class="rp-cando-unlock" id="rp-cando-unlock"></div>
        <div class="rp-complete-stats" id="rp-complete-stats"></div>
        <button id="rp-again-btn" class="btn-secondary" style="width:100%;margin-bottom:10px">もう一度 🔁</button>
        <button id="rp-done-btn" class="btn-primary" style="width:100%">完了 ✓</button>
      </div>
    </div>
  </div>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="talk">
      <span class="tab-icon">🎙️</span>
      <span>会話</span>
    </button>
    <button class="tab-btn" data-tab="phrases">
      <span class="tab-icon">📖</span>
      <span>フレーズ</span>
    </button>
    <button class="tab-btn" data-tab="progress">
      <span class="tab-icon">🏅</span>
      <span>できること</span>
    </button>
  </nav>

</div>

<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
